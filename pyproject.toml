[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euro-area-macro-monitor"
version = "0.1.0"
description = "Automated ETL pipeline for euro area and US macro indicators"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
